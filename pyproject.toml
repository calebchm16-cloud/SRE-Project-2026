[project]
name = "cahuita-conditions"
version = "0.1.0"
description = "A small observable weather and marine forecast application."
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
dependencies = [
  "fastapi>=0.115", "uvicorn>=0.34", "httpx>=0.28", "pydantic-settings>=2.7",
  "aiosqlite>=0.21", "jinja2>=3.1.6", "prometheus-client>=0.21",
  "opentelemetry-sdk>=1.30", "opentelemetry-exporter-otlp-proto-http>=1.30",
  "opentelemetry-instrumentation-fastapi>=0.51b0",
  "opentelemetry-instrumentation-httpx>=0.51b0",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "pytest-cov>=6", "ruff>=0.11", "playwright>=1.51"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cahuita_conditions"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["browser: real browser test with JavaScript disabled"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
