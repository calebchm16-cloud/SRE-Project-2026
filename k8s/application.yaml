apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cahuita-cache
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cahuita-conditions
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cahuita-conditions
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cahuita-conditions
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8000"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: cahuita-conditions:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: cahuita-settings
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          volumeMounts:
            - name: cache
              mountPath: /data
            - name: locations
              mountPath: /app/config
              readOnly: true
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: cahuita-cache
        - name: locations
          configMap:
            name: cahuita-locations
---
apiVersion: v1
kind: Service
metadata:
  name: cahuita-conditions
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cahuita-conditions
  ports:
    - name: http
      port: 8000
      targetPort: http
