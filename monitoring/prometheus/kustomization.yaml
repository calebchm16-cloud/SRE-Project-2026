apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - prometheus.yaml
  - rbac.yaml
labels:
  - pairs:
      app.kubernetes.io/name: prometheus
      app.kubernetes.io/part-of: cahuita-conditions
    includeSelectors: false
configMapGenerator:
  - name: prometheus-config
    namespace: monitoring
    files:
      - prometheus.yml
      - alerts.yml
