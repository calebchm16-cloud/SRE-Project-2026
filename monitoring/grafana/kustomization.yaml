apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - grafana.yaml
labels:
  - pairs:
      app.kubernetes.io/name: grafana
      app.kubernetes.io/part-of: cahuita-conditions
    includeSelectors: false
configMapGenerator:
  - name: grafana-provisioning
    files:
      - datasource.yml
      - dashboards.yml
  - name: grafana-dashboards
    files:
      - application.json=dashboards/application.json
      - forecasts.json=dashboards/forecasts.json
